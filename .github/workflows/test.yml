name: ML Anomaly Detection Tests

on:
  push:
    branches: [ main, feature/ml-anomaly ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run ML and API Anomaly Detection Tests
        run: |
          python3 -m unittest discover -s backend/tests -p 'test_anomaly*.py'
